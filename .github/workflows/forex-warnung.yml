name: Forex-Warnung
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forex-warnung
  cancel-in-progress: false
jobs:
  check-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kalender prüfen und Telegram benachrichtigen
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
      - name: Kalenderstand sichern
        run: |
          if git status --porcelain -- seen_events.json | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add seen_events.json
            git commit -m 'Kalenderstand aktualisieren [skip ci]'
            git push
          else
            echo 'Keine Änderungen.'
          fi
